name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo, which is enabled by default on both runners.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binary
        run: go build -o bin/gossh .

      - name: CLI smoke test
        run: |
          chmod +x test/test-cli.sh
          ./test/test-cli.sh
